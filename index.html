<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vocabulary & Spelling Practice</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center p-4">

  <div class="max-w-xl w-full bg-white rounded-2xl shadow-xl p-6 my-auto">
    <!-- Header -->
    <header class="text-center mb-6">
      <h1 class="text-2xl font-bold text-slate-800">Spelling & Word Practice</h1>
      <p class="text-sm text-slate-500">Master your word list with interactive modes</p>
    </header>

    <!-- Navigation / Mode Selector -->
    <nav class="flex justify-center gap-2 mb-6 border-b pb-4">
      <button onclick="setMode('test')" id="tab-test" class="px-4 py-2 text-sm font-semibold rounded-lg bg-indigo-600 text-white">Spelling Test</button>
      <button onclick="setMode('scramble')" id="tab-scramble" class="px-4 py-2 text-sm font-semibold rounded-lg bg-slate-200 text-slate-700 hover:bg-slate-300">Word Scramble</button>
      <button onclick="setMode('flashcard')" id="tab-flashcard" class="px-4 py-2 text-sm font-semibold rounded-lg bg-slate-200 text-slate-700 hover:bg-slate-300">Flashcards</button>
    </nav>

    <!-- Game Card Area -->
    <main id="app-container" class="min-h-[250px] flex flex-col justify-center items-center">
      <p class="text-slate-400 animate-pulse">Loading word list...</p>
    </main>

    <!-- Status Banner -->
    <footer class="mt-6 pt-4 border-t text-center text-xs text-slate-400" id="status-banner">
      Connecting to words.json...
    </footer>
  </div>

  <script>
    let wordList = [];
    let currentWordIndex = 0;
    let currentMode = 'test';

    // Fallback word list if words.json fails or runs locally without HTTP server
    const fallbackWords = [
      { word: "accommodate", definition: "To provide lodging or sufficient space for." },
      { word: "phenomenon", definition: "A remarkable development or observable occurrence." },
      { word: "rhythm", definition: "A strong, regular, repeated pattern of movement or sound." },
      { word: "conscientious", definition: "Wishing to do what is right, especially to do work well." }
    ];

    // Fetch JSON with automatic fallback and cache-busting
    async function loadWordData() {
      const statusBanner = document.getElementById('status-banner');
      try {
        const response = await fetch('./words.json?t=' + Date.now());
        if (!response.ok) throw new Error('HTTP status ' + response.status);
        const data = await response.json();
        
        if (Array.isArray(data) && data.length > 0) {
          wordList = data;
          statusBanner.textContent = `Loaded ${wordList.length} words from words.json`;
          statusBanner.className = "mt-6 pt-4 border-t text-center text-xs text-emerald-600 font-medium";
        } else {
          throw new Error('JSON array empty');
        }
      } catch (err) {
        console.warn('Could not fetch words.json, using fallback data:', err);
        wordList = fallbackWords;
        statusBanner.textContent = "Using fallback words (serve over HTTP/HTTPS to load words.json)";
        statusBanner.className = "mt-6 pt-4 border-t text-center text-xs text-amber-600 font-medium";
      }

      renderCurrentMode();
    }

    // Text-To-Speech
    function speakWord(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
      }
    }

    // Switch between modes
    function setMode(mode) {
      currentMode = mode;
      currentWordIndex = 0;

      ['test', 'scramble', 'flashcard'].forEach(m => {
        const tab = document.getElementById(`tab-${m}`);
        if (m === mode) {
          tab.className = "px-4 py-2 text-sm font-semibold rounded-lg bg-indigo-600 text-white";
        } else {
          tab.className = "px-4 py-2 text-sm font-semibold rounded-lg bg-slate-200 text-slate-700 hover:bg-slate-300";
        }
      });

      renderCurrentMode();
    }

    // Render active game mode
    function renderCurrentMode() {
      if (wordList.length === 0) return;
      
      const container = document.getElementById('app-container');
      const item = wordList[currentWordIndex];

      if (currentMode === 'test') {
        container.innerHTML = `
          <div class="w-full text-center space-y-4">
            <button onclick="speakWord('${item.word}')" class="bg-indigo-100 hover:bg-indigo-200 text-indigo-700 font-medium px-4 py-2 rounded-full inline-flex items-center gap-2 text-sm">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.63 12 4.109 12 5v14c0 .891-1.077 1.37-1.707.707L5.586 15z"></path></svg>
              Pronounce Word
            </button>
            <p class="text-sm text-slate-500 italic">Definition: "${item.definition || 'No definition available'}"</p>
            <input type="text" id="userInput" placeholder="Type the word here..." autocomplete="off" class="w-full text-center text-lg px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            <div class="flex gap-2">
              <button onclick="checkSpelling()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 rounded-xl">Submit</button>
              <button onclick="nextWord()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold px-4 py-2 rounded-xl">Skip</button>
            </div>
            <div id="feedback" class="h-6 text-sm font-medium"></div>
          </div>
        `;
        
        document.getElementById('userInput').addEventListener('keypress', (e) => {
          if (e.key === 'Enter') checkSpelling();
        });

      } else if (currentMode === 'scramble') {
        const scrambled = item.word.split('').sort(() => Math.random() - 0.5).join('');
        container.innerHTML = `
          <div class="w-full text-center space-y-4">
            <div class="tracking-widest text-3xl font-extrabold text-indigo-600 uppercase bg-slate-50 py-3 rounded-xl border border-slate-200">${scrambled}</div>
            <p class="text-sm text-slate-500 italic">Definition: "${item.definition || 'N/A'}"</p>
            <input type="text" id="userInput" placeholder="Unscramble the word..." autocomplete="off" class="w-full text-center text-lg px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            <div class="flex gap-2">
              <button onclick="checkSpelling()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 rounded-xl">Submit</button>
              <button onclick="nextWord()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold px-4 py-2 rounded-xl">Skip</button>
            </div>
            <div id="feedback" class="h-6 text-sm font-medium"></div>
          </div>
        `;

        document.getElementById('userInput').addEventListener('keypress', (e) => {
          if (e.key === 'Enter') checkSpelling();
        });

      } else if (currentMode === 'flashcard') {
        container.innerHTML = `
          <div class="w-full flex flex-col items-center space-y-4">
            <div class="w-full h-48 bg-indigo-50 border-2 border-indigo-200 rounded-2xl p-6 flex flex-col justify-center items-center text-center shadow-sm">
              <h2 class="text-3xl font-bold text-indigo-900 mb-2">${item.word}</h2>
              <p class="text-sm text-slate-600">${item.definition || 'No definition available'}</p>
            </div>
            <div class="flex gap-3 w-full">
              <button onclick="speakWord('${item.word}')" class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-800 font-semibold py-2 rounded-xl">🔊 Speak</button>
              <button onclick="nextWord()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 rounded-xl">Next Card →</button>
            </div>
            <p class="text-xs text-slate-400">Card ${currentWordIndex + 1} of ${wordList.length}</p>
          </div>
        `;
      }
    }

    function checkSpelling() {
      const input = document.getElementById('userInput');
      const feedback = document.getElementById('feedback');
      if (!input || !feedback) return;

      const targetWord = wordList[currentWordIndex].word.trim().toLowerCase();
      const userVal = input.value.trim().toLowerCase();

      if (userVal === targetWord) {
        feedback.textContent = "✓ Correct!";
        feedback.className = "h-6 text-sm font-medium text-emerald-600";
        setTimeout(nextWord, 800);
      } else {
        feedback.textContent = "✕ Incorrect, try again.";
        feedback.className = "h-6 text-sm font-medium text-rose-600";
      }
    }

    function nextWord() {
      currentWordIndex = (currentWordIndex + 1) % wordList.length;
      renderCurrentMode();
    }

    // Initialize automatically when the page loads
    document.addEventListener('DOMContentLoaded', loadWordData);
  </script>
</body>
</html>
